<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three.js 感应粒子网络</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #10110f;
        color: #f2efe7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: #10110f;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(#2b312a 1px, transparent 1px),
          linear-gradient(90deg, #2b312a 1px, transparent 1px), #10110f;
        background-size: 48px 48px;
        color: #f7c84b;
        font-size: 14px;
        letter-spacing: 0;
        z-index: 2;
      }
      .hud {
        position: fixed;
        inset: 24px 24px auto;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
      }
      .identity {
        display: grid;
        gap: 6px;
      }
      .eyebrow,
      .metric {
        margin: 0;
        color: #9ba195;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 10ch;
        font-size: clamp(30px, 6vw, 74px);
        font-weight: 650;
        line-height: 0.92;
        letter-spacing: 0;
      }
      .metric {
        color: #f2efe7;
        text-align: right;
      }
      .metric strong {
        display: block;
        color: #e14f3d;
        font-size: 28px;
        font-variant-numeric: tabular-nums;
      }
      .hint {
        position: fixed;
        left: 24px;
        bottom: 22px;
        z-index: 1;
        margin: 0;
        color: #9ba195;
        font-size: 12px;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .hint {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .hud {
          inset: 18px 16px auto;
        }
        .hint {
          left: 16px;
          bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="fallback" role="status">正在建立粒子场…</div>
    <div class="hud">
      <div class="identity">
        <p class="eyebrow">Three.js / L3 Scene</p>
        <h1>感应粒子网络</h1>
      </div>
      <p class="metric">邻接连线<strong id="linkCount">000</strong></p>
    </div>
    <p class="hint">移动指针扰动空间 · 按下吸引粒子</p>
    <canvas aria-label="可交互的三维粒子网络"></canvas>

    <script type="module">
      const fallback = document.querySelector(".fallback");
      const canvas = document.querySelector("canvas");
      const linkCount = document.querySelector("#linkCount");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let disposed = false;
      let frameId = 0;
      let renderer;
      let scene;
      let camera;
      let points;
      let links;

      try {
        const THREE = await import(
          "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
        );

        renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false,
          powerPreference: "high-performance",
        });
        renderer.setPixelRatio(dpr);
        renderer.setClearColor(0x10110f, 1);

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x10110f, 0.055);
        camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
        camera.position.set(0, 0, 15);

        const count = reducedMotion ? 95 : 180;
        const positions = new Float32Array(count * 3);
        const base = new Float32Array(count * 3);
        const velocity = new Float32Array(count * 3);
        for (let index = 0; index < count; index += 1) {
          const radius = 2.8 + Math.random() * 5.6;
          const angle = Math.random() * Math.PI * 2;
          const y = (Math.random() - 0.5) * 8;
          const offset = index * 3;
          positions[offset] = Math.cos(angle) * radius;
          positions[offset + 1] = y;
          positions[offset + 2] = Math.sin(angle) * radius * 0.65;
          base.set(positions.subarray(offset, offset + 3), offset);
          velocity[offset] = (Math.random() - 0.5) * 0.005;
          velocity[offset + 1] = (Math.random() - 0.5) * 0.005;
          velocity[offset + 2] = (Math.random() - 0.5) * 0.005;
        }

        const pointGeometry = new THREE.BufferGeometry();
        pointGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        const pointMaterial = new THREE.PointsMaterial({
          color: 0xf7c84b,
          size: 0.075,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.9,
        });
        points = new THREE.Points(pointGeometry, pointMaterial);
        scene.add(points);

        const linePositions = new Float32Array(count * 7 * 6);
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(linePositions, 3),
        );
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0x6aa59d,
          transparent: true,
          opacity: 0.22,
          blending: THREE.AdditiveBlending,
        });
        links = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(links);

        const raycaster = new THREE.Raycaster();
        raycaster.params.Points.threshold = 1.2;
        const pointer = new THREE.Vector2(2, 2);
        const target = new THREE.Vector3();
        const pointerPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let pressed = false;

        function setPointer(event) {
          pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
          pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          raycaster.ray.intersectPlane(pointerPlane, target);
        }

        window.addEventListener("pointermove", setPointer, { passive: true });
        window.addEventListener("pointerdown", (event) => {
          pressed = true;
          setPointer(event);
        });
        window.addEventListener("pointerup", () => {
          pressed = false;
        });

        function resize() {
          const width = window.innerWidth;
          const height = window.innerHeight;
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        window.addEventListener("resize", resize);
        resize();

        function updateNetwork(time) {
          const position = pointGeometry.attributes.position.array;
          let cursor = 0;
          let connectionCount = 0;
          const threshold = window.innerWidth < 640 ? 1.65 : 1.35;

          for (let index = 0; index < count; index += 1) {
            const offset = index * 3;
            let x = position[offset];
            let y = position[offset + 1];
            let z = position[offset + 2];
            const dx = x - target.x;
            const dy = y - target.y;
            const distance = Math.sqrt(dx * dx + dy * dy) + 0.001;
            if (distance < 3.8 && pointer.x < 1) {
              const force = (3.8 - distance) * (pressed ? -0.00045 : 0.0011);
              velocity[offset] += (dx / distance) * force;
              velocity[offset + 1] += (dy / distance) * force;
            }
            velocity[offset] += (base[offset] - x) * 0.00006;
            velocity[offset + 1] +=
              (base[offset + 1] - y) * 0.00006;
            velocity[offset + 2] +=
              (base[offset + 2] - z) * 0.00006;
            velocity[offset] *= 0.985;
            velocity[offset + 1] *= 0.985;
            velocity[offset + 2] *= 0.985;
            position[offset] += velocity[offset];
            position[offset + 1] += velocity[offset + 1];
            position[offset + 2] += velocity[offset + 2];

            for (
              let peer = index + 1;
              peer < Math.min(index + 8, count);
              peer += 1
            ) {
              const peerOffset = peer * 3;
              const sx = position[offset] - position[peerOffset];
              const sy = position[offset + 1] - position[peerOffset + 1];
              const sz = position[offset + 2] - position[peerOffset + 2];
              if (sx * sx + sy * sy + sz * sz > threshold * threshold) continue;
              linePositions[cursor++] = position[offset];
              linePositions[cursor++] = position[offset + 1];
              linePositions[cursor++] = position[offset + 2];
              linePositions[cursor++] = position[peerOffset];
              linePositions[cursor++] = position[peerOffset + 1];
              linePositions[cursor++] = position[peerOffset + 2];
              connectionCount += 1;
            }
          }

          pointGeometry.attributes.position.needsUpdate = true;
          lineGeometry.setDrawRange(0, cursor / 3);
          lineGeometry.attributes.position.needsUpdate = true;
          linkCount.textContent = String(connectionCount).padStart(3, "0");
          if (!reducedMotion) {
            points.rotation.y = time * 0.000025;
            links.rotation.y = points.rotation.y;
          }
        }

        function frame(time) {
          if (disposed) return;
          updateNetwork(time);
          camera.position.x += (pointer.x * 0.7 - camera.position.x) * 0.015;
          camera.position.y += (pointer.y * 0.45 - camera.position.y) * 0.015;
          camera.lookAt(0, 0, 0);
          renderer.render(scene, camera);
          frameId = requestAnimationFrame(frame);
        }

        fallback.remove();
        frame(0);
      } catch (error) {
        fallback.textContent = "WebGL 场景加载失败，仍可浏览其他素材";
        console.error(error);
      }

      function disposeScene() {
        if (disposed) return;
        disposed = true;
        cancelAnimationFrame(frameId);
        scene?.traverse((object) => {
          object.geometry?.dispose();
          if (Array.isArray(object.material)) {
            object.material.forEach((material) => material.dispose());
          } else {
            object.material?.dispose();
          }
        });
        renderer?.dispose();
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "fx:dispose") disposeScene();
      });
      window.addEventListener("pagehide", disposeScene);
    </script>
  </body>
</html>
